server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html no tiene nombre con hash (a diferencia de /assets/), asi que
  # sin esto el navegador puede servirlo cacheado por "frescura heuristica"
  # (no manda Cache-Control, solo Last-Modified/ETag) y mostrar una version
  # vieja del frontend aunque el contenedor ya tenga el build nuevo. Esto
  # afecta especialmente a la app de escritorio (Electron), que mantiene su
  # cache HTTP entre instalaciones.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
