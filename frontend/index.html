<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Cafe Shopping · POS</title>

    <!-- Permite "Agregar a pantalla de inicio" en Android: se abre a pantalla
         completa, sin la barra de direcciones ni pestañas del navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-512.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#e57d90" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cafe Shopping" />
    <script>
      // Aplica el tema ANTES de pintar, para que no haya un parpadeo claro
      // al abrir en modo oscuro. La misma clave y logica que usa
      // src/lib/useTheme.ts -- si se toca una, tocar la otra igual.
      (function () {
        try {
          var t = localStorage.getItem('cafe-shopping-tema');
          if (t === 'oscuro') {
            document.documentElement.classList.add('dark');
            return;
          }
          if (t === 'claro') return;
          // Sin preferencia guardada: en el celular arranca en claro sin
          // importar el tema del sistema operativo (Android casi siempre
          // trae "oscuro" de fabrica). En PC si se respeta el tema de Windows.
          var esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          var oscuro = !esMovil && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
