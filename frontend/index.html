<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastelería María</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <meta name="theme-color" content="#e57d90" />
    <script>
      // Aplica el tema ANTES de pintar, para que no haya un parpadeo claro
      // al abrir en modo oscuro. La misma clave y logica que usa
      // src/lib/useTheme.ts -- si se toca una, tocar la otra igual.
      (function () {
        try {
          var t = localStorage.getItem('pasteleria-maria-tema');
          if (t === 'oscuro') {
            document.documentElement.classList.add('dark');
            return;
          }
          if (t === 'claro') return;
          // Sin preferencia guardada se respeta el tema de Windows.
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
