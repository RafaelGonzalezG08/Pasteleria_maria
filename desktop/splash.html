<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #FCF3F5;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #3A2830;
    -webkit-app-region: drag;
    user-select: none;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #D36A88;
  }
  .spinner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid #E5F0D5;
    border-top-color: #D36A88;
    animation: spin 0.9s linear infinite;
  }
  #status {
    font-size: 13px;
    color: #967E87;
    min-height: 18px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Rosa Delicias</div>
    <div class="spinner"></div>
    <div id="status">Iniciando...</div>
  </div>
  <script>
    window.setStatus = function (text) {
      document.getElementById('status').textContent = text;
    };
  </script>
</body>
</html>
