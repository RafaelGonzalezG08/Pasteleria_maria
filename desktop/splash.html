<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #F4F5F0; /* el crema del logo */
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #382C2E;
    -webkit-app-region: drag;
    user-select: none;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  .logo {
    height: 200px;
    width: auto;
  }
  .spinner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid #E5EED4;
    border-top-color: #DE92A0;
    animation: spin 0.9s linear infinite;
  }
  #status {
    font-size: 13px;
    color: #526024;
    min-height: 18px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="build/logo-splash.png" alt="Rosa Delicias" />
    <div class="spinner"></div>
    <div id="status">Iniciando...</div>
  </div>
  <script>
    window.setStatus = function (text) {
      document.getElementById('status').textContent = text;
    };
  </script>
</body>
</html>
