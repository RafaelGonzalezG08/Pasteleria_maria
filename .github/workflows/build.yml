name: Build and Release

# Genera el instalador de Windows y lo sube a un release de GitHub de ESTE
# repositorio (RafaelGonzalezG08/Pasteleria_maria) al empujar un tag "v*"
# (ej. v1.0.1). electron-updater usa ese release + latest.yml para ofrecer la
# actualizacion automatica a las PCs que ya tienen la app.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # crear el release y subirle los archivos

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Backend ----
      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Generar Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Compilar backend (bundle para el instalador)
        run: npm run build:desktop
        working-directory: backend

      # ---- Frontend ----
      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Compilar frontend
        # El puerto tiene que coincidir con BACKEND_PORT de desktop/nativo.js.
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3010/api

      # ---- Agente de WhatsApp (.ahk -> .exe) ----
      # Se compila aqui para que la PC del negocio no necesite AutoHotkey.
      - name: Compilar el agente de WhatsApp
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ahk.zip"
          $dir = "$env:RUNNER_TEMP\ahk"
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $compilador = Get-ChildItem -Path $dir -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          $bin = Get-ChildItem -Path $dir -Recurse -Filter "Unicode 64-bit.bin" | Select-Object -First 1
          if (-not $compilador -or -not $bin) { throw "No se encontro el compilador de AutoHotkey en el zip." }
          & $compilador.FullName /in "send_whatsapp_agent.ahk" /out "send_whatsapp_agent.exe" /bin $bin.FullName | Out-Default
          if (-not (Test-Path "send_whatsapp_agent.exe")) { throw "No se genero send_whatsapp_agent.exe" }

      # ---- Instalador ----
      - name: Instalar dependencias del empaquetador
        run: npm ci
        working-directory: desktop

      # La version del instalador (y la que compara electron-updater) sale del
      # tag: "v1.0.1" -> 1.0.1. Asi no hace falta acordarse de subir el
      # numero en desktop/package.json antes de taggear.
      - name: Fijar version desde el tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
        working-directory: desktop

      - name: Generar instalador
        # --publish never: el release lo crea el paso siguiente (un solo lugar
        # que sube archivos, sin carreras entre los dos).
        run: npx electron-builder --publish never
        working-directory: desktop

      - name: Subir al release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/pasteleria-maria-v*.exe
            desktop/dist/pasteleria-maria-v*.exe.blockmap
            desktop/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
