name: CI

# Lint + compilacion + tests en cada push y pull request. La app es nativa
# (Electron + SQLite), asi que no hace falta ningun servicio de base de datos:
# los tests que tocan Prisma usan un archivo SQLite temporal.

on:
  push:
    branches: [main, version-nativa]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'file:./ci.db'
      JWT_SECRET: test-secret-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Sin --fix (el script "lint" lo trae): en CI queremos que falle, no que
      # arregle en silencio.
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm run build
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Solo se valida que los scripts del arranque nativo no tengan errores de
      # sintaxis; empaquetar el instalador de Windows es cosa de build.yml.
      - run: node --check main.js
      - run: node --check nativo.js
      - run: node --check compilar.js
